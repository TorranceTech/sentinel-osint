[package]
name = "sentinel-collectors"
description = "Collectors, hardened HTTP client and investigation engine for Sentinel OSINT"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
sentinel-core.workspace = true

# `clock` is enabled here (unlike in sentinel-core): the engine is where
# wall-clock time enters the system, through the `Clock` trait.
chrono = { workspace = true, features = ["clock"] }
hickory-resolver.workspace = true
reqwest.workspace = true
serde_json.workspace = true
secrecy.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "io-util"] }
tracing-subscriber.workspace = true
wiremock.workspace = true

[lints]
workspace = true
